name: CI

on:
    push:
        branches:
            - main
            - develop
            - release/*
    pull_request:
        branches:
            - main
            - develop
            - release/*
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        name: Build and Test (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Needed by davelosert/vitest-coverage-report-action to post
            # the coverage summary as a PR comment.
            pull-requests: write
        strategy:
            fail-fast: false
            matrix:
                node-version: [22, 24]
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
              with:
                  egress-policy: audit
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
              # version comes from package.json "packageManager"

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: ESLint
              run: pnpm run lint

            - name: Build packages
              run: pnpm run build

            # Response-field completeness: every schema reachable from a
            # mirror node spec response must be carried by the wire types.
            - name: Mirror spec field diff
              working-directory: packages/mirror
              run: node spec/diff-response-fields.mjs

            # Sanity check that the package's published types are complete
            - name: Check published types
              run: |
                  for pkg in core mirror express fastify nest; do
                    echo "::group::attw $pkg"
                    (cd "packages/$pkg" && pnpm exec attw --pack)
                    echo "::endgroup::"
                  done

            - name: Setup Hiero Solo Network
              uses: hiero-ledger/hiero-solo-action@bdae0a37df52190b6b3801c1c981c0ed37f4616e # v0.23.0
              id: solo
              with:
                  installMirrorNode: true
                  nodeVersion: ${{ matrix.node-version }}

            - name: Wait for Mirror Node
              run: |
                  echo "Waiting for Mirror Node REST API to be ready..."
                  REST_READY=""
                  for i in $(seq 1 60); do
                    if curl -s http://localhost:38081/api/v1/accounts | grep -q "accounts"; then
                      echo "Mirror Node is ready!"
                      REST_READY="yes"
                      break
                    fi
                    echo "Attempt $i/60 — waiting 5s..."
                    sleep 5
                  done
                  if [ -z "$REST_READY" ]; then
                    echo "::error::Mirror Node REST on http://localhost:38081 never became reachable" >&2
                    exit 1
                  fi
              env:
                  HIERO_MIRROR_NODE_URL: http://localhost:38081

            - name: Wait for Mirror Node gRPC (consensus stream)
              run: |
                  echo "Waiting for Mirror Node gRPC (localhost:5600) to accept TCP connections..."
                  gRPC_READY=""
                  for i in $(seq 1 60); do
                    if timeout 2 bash -c '</dev/tcp/localhost/5600' 2>/dev/null; then
                      echo "Mirror Node gRPC is accepting connections."
                      gRPC_READY="yes"
                      break
                    fi
                    echo "Attempt $i/60 — waiting 5s..."
                    sleep 5
                  done
                  if [ -z "$gRPC_READY" ]; then
                    echo "::error::Mirror Node gRPC on localhost:5600 never became reachable" >&2
                    exit 1
                  fi

            - name: Run integration tests
              env:
                  HIERO_NETWORK: hiero-solo-action
                  HIERO_OPERATOR_ID: ${{ steps.solo.outputs.accountId }}
                  HIERO_OPERATOR_KEY: ${{ steps.solo.outputs.privateKey }}
                  HIERO_OPERATOR_KEY_TYPE: DER
                  HIERO_NETWORK_NODES: "127.0.0.1:35211=0.0.3"
                  HIERO_MIRROR_NODE_URL: http://localhost:38081
              run: pnpm --filter @hiero-hackers/enterprise-core run test:integration:coverage

            - name: Report integration coverage
              if: ${{ always() && matrix.node-version == 24 }}
              uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
              with:
                  name: "core / integration"
                  # `working-directory` scopes the paths below; keep them
                  # relative to `./packages/core` so the action resolves
                  # them under it rather than doubling the prefix.
                  working-directory: ./packages/core
                  json-summary-path: ./coverage/integration/coverage-summary.json
                  json-final-path: ./coverage/integration/coverage-final.json
                  vite-config-path: ./test/vitest-integration.config.ts
                  file-coverage-mode: changes

            - name: Run unit tests
              env:
                  HIERO_NETWORK: hiero-solo-action
                  HIERO_OPERATOR_ID: ${{ steps.solo.outputs.accountId }}
                  HIERO_OPERATOR_KEY: ${{ steps.solo.outputs.privateKey }}
              run: pnpm --filter @hiero-hackers/enterprise-core run test:unit:coverage

            - name: Report unit coverage
              if: ${{ always() && matrix.node-version == 24 }}
              uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
              with:
                  name: "core / unit"
                  # `working-directory` scopes the paths below; keep them
                  # relative to `./packages/core` so the action resolves
                  # them under it rather than doubling the prefix.
                  working-directory: ./packages/core
                  json-summary-path: ./coverage/node/coverage-summary.json
                  json-final-path: ./coverage/node/coverage-final.json
                  vite-config-path: ./test/vitest.config.ts
                  file-coverage-mode: changes

            - name: Run mirror unit tests
              run: pnpm --filter @hiero-hackers/enterprise-mirror run test:unit:coverage

            - name: Report mirror unit coverage
              if: ${{ always() && matrix.node-version == 24 }}
              uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
              with:
                  name: "mirror / unit"
                  working-directory: ./packages/mirror
                  json-summary-path: ./coverage/node/coverage-summary.json
                  json-final-path: ./coverage/node/coverage-final.json
                  vite-config-path: ./test/vitest.config.ts
                  file-coverage-mode: changes

            - name: Extract unit coverage percentage
              # Only run on push to main so the badge reflects the merged
              # state.
              if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.node-version == 24 }}
              id: coverage
              run: |
                  pct=$(node -e "console.log(require('./packages/core/coverage/node/coverage-summary.json').total.lines.pct)")
                  echo "pct=$pct" >> "$GITHUB_OUTPUT"

            - name: Update coverage badge gist
              if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.node-version == 24 }}
              uses: Schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
              with:
                  auth: ${{ secrets.GIST_SECRET }}
                  gistID: ${{ vars.COVERAGE_GIST_ID }}
                  filename: hiero-enterprise-js-coverage.json
                  label: coverage
                  message: ${{ steps.coverage.outputs.pct }}%
                  valColorRange: ${{ steps.coverage.outputs.pct }}
                  minColorRange: 50
                  maxColorRange: 95

            - name: Run examples
              env:
                  HIERO_NETWORK: hiero-solo-action
                  HIERO_ED25519_OPERATOR_ID: ${{ steps.solo.outputs.ed25519AccountId }}
                  HIERO_ED25519_OPERATOR_KEY: ${{ steps.solo.outputs.ed25519PrivateKey }}
                  HIERO_ECDSA_OPERATOR_ID: ${{ steps.solo.outputs.ecdsaAccountId }}
                  HIERO_ECDSA_OPERATOR_KEY: ${{ steps.solo.outputs.ecdsaPrivateKey }}
                  HIERO_MIRROR_NODE_URL: http://localhost:38081
                  HIERO_NETWORK_NODES: "127.0.0.1:35211=0.0.3"
              run: pnpm --filter @hiero-hackers/examples examples

            # Write-then-read round-trips: core creates entities on Solo, the
            # mirror repositories read them back — the layer that catches
            # mirror response-shape drift. Runs LAST: it hits a live network
            # with eventual-consistency polling, so it is the flakiest step;
            # keeping it after the deterministic unit tests + coverage reports
            # means a network blip here never blocks coverage reporting.
            - name: Run mirror round-trip tests
              env:
                  HIERO_NETWORK: hiero-solo-action
                  HIERO_OPERATOR_ID: ${{ steps.solo.outputs.accountId }}
                  HIERO_OPERATOR_KEY: ${{ steps.solo.outputs.privateKey }}
                  HIERO_OPERATOR_KEY_TYPE: DER
                  HIERO_NETWORK_NODES: "127.0.0.1:35211=0.0.3"
                  HIERO_MIRROR_NODE_URL: http://localhost:38081
              run: pnpm --filter @hiero-hackers/enterprise-mirror run test:integration
