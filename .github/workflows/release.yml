# SPDX-License-Identifier: Apache-2.0
# Publishes the @hiero-hackers/* packages to the GitHub Packages npm registry
# (npm.pkg.github.com) when a version bump lands on main. Publishing authenticates with the
# workflow's own GITHUB_TOKEN (`packages: write`) — no npm account and no
# long-lived secret anywhere. (npm provenance is an npmjs.org-only feature,
# so it is not attached here; the registry itself links every version to
# this repo and the publishing workflow run.)
#
# CONSUMING these packages requires GitHub auth even though they are public
# (a GitHub Packages limitation): a token with `read:packages` in the
# consumer's .npmrc. See CONTRIBUTING "Installing the published packages".
#
# This is a pnpm workspace, so `pnpm -r publish` (not `npm publish`) is used: it
# skips `private` packages (the samples and the repo root), rewrites every
# `workspace:*` dependency to the concrete version being published, and
# publishes in dependency order. Re-running after a version already exists
# fails cleanly, so there is no double-publish.
#
# Releases run from `main`: when a merge changes the root package.json
# version and no `v<version>` tag exists yet, this workflow publishes the
# packages, tags the merged commit and opens a draft GitHub Release with the
# CHANGELOG section for that version. Review the draft and publish it.
#
# To release: bump the version across the whole workspace (root + every
# packages/* — keep them in lockstep), date the CHANGELOG section and merge
# the release PR. Nothing to tag by hand. `workflow_dispatch` re-runs the
# same steps on `main`, e.g. after a failed publish.
name: Release

on:
    push:
        branches: [main]
        paths: [package.json]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    publish:
        name: Publish to GitHub Packages
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write # push the tag and create the draft Release
            packages: write # publish to npm.pkg.github.com with GITHUB_TOKEN
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
              with:
                  egress-policy: audit

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # A version that already has a tag was released before, so a
            # package.json change without a bump publishes nothing.
            - name: Resolve version
              id: version
              run: |
                  version=$(node -p "require('./package.json').version")
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
                      echo "v$version is already tagged — nothing to release"
                      echo "release=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "releasing $version"
                      echo "release=true" >> "$GITHUB_OUTPUT"
                  fi

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              if: steps.version.outputs.release == 'true'
              # version comes from package.json "packageManager"

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              if: steps.version.outputs.release == 'true'
              with:
                  node-version: "22"
                  registry-url: "https://npm.pkg.github.com"
                  scope: "@hiero-hackers"
                  cache: pnpm

            - run: pnpm install --frozen-lockfile
              if: steps.version.outputs.release == 'true'

            # Every publishable package must carry that same version — guards
            # against a half-bumped workspace publishing mixed versions.
            - name: Packages share the workspace version
              if: steps.version.outputs.release == 'true'
              run: |
                  root=$(node -p "require('./package.json').version")
                  for p in packages/*/; do
                      name=$(node -p "require('./${p}package.json').name")
                      priv=$(node -p "require('./${p}package.json').private === true")
                      [ "$priv" = "true" ] && continue
                      v=$(node -p "require('./${p}package.json').version")
                      if [ "$v" != "$root" ]; then
                          echo "::error::$name is $v, expected $root"
                          exit 1
                      fi
                  done

            # dist/ must exist before publish (each package ships `files: [dist]`).
            - name: Build
              if: steps.version.outputs.release == 'true'
              run: pnpm -r run build

            - name: Publish
              if: steps.version.outputs.release == 'true'
              run: pnpm -r publish --no-git-checks
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Tag only after the publish succeeded, so a tag never points at
            # versions that are not on the registry.
            - name: Tag the release commit
              if: steps.version.outputs.release == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: v${{ steps.version.outputs.version }}
              run: |
                  gh api "repos/$GITHUB_REPOSITORY/git/refs" \
                      -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

            # A draft, so the notes can be reviewed before the Release goes
            # public. The CHANGELOG section for the version is the body.
            - name: Create draft GitHub Release
              if: steps.version.outputs.release == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  awk -v heading="## [$VERSION]" '
                      index($0, heading) == 1 { found = 1; next }
                      found && /^## \[/ { exit }
                      found { print }
                  ' CHANGELOG.md > /tmp/changelog.md
                  # Heredoc rather than --notes: the body is markdown, and any
                  # stray leading indentation would render as a code block.
                  cat > /tmp/release-notes.md <<EOF
                  Published to the [GitHub Packages npm registry](https://github.com/orgs/hiero-hackers/packages?repo_name=hiero-enterprise-js) at \`$VERSION\`:

                  - \`@hiero-hackers/enterprise-core\`
                  - \`@hiero-hackers/enterprise-mirror\`

                  Installing requires a GitHub token with \`read:packages\` — see [CONTRIBUTING](https://github.com/hiero-hackers/hiero-enterprise-js/blob/main/CONTRIBUTING.md#installing-the-published-packages).
                  EOF
                  cat /tmp/changelog.md >> /tmp/release-notes.md
                  gh release create "v$VERSION" \
                      --draft \
                      --verify-tag \
                      --title "v$VERSION" \
                      --notes-file /tmp/release-notes.md
