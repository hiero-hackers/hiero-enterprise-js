# SPDX-License-Identifier: Apache-2.0
# Publishes the @hiero-hackers/* packages to the GitHub Packages npm registry
# (npm.pkg.github.com) on a version tag. Publishing authenticates with the
# workflow's own GITHUB_TOKEN (`packages: write`) — no npm account and no
# long-lived secret anywhere. (npm provenance is an npmjs.org-only feature,
# so it is not attached here; the registry itself links every version to
# this repo and the publishing workflow run.)
#
# CONSUMING these packages requires GitHub auth even though they are public
# (a GitHub Packages limitation): a token with `read:packages` in the
# consumer's .npmrc. See CONTRIBUTING "Installing the published packages".
#
# This is a pnpm workspace, so `pnpm -r publish` (not `npm publish`) is used: it
# skips `private` packages (the samples and the repo root), rewrites every
# `workspace:*` dependency to the concrete version being published, and
# publishes in dependency order (core/mirror before the express/fastify/nest
# adapters). Re-running after a version already exists fails cleanly, so
# there is no double-publish.
#
# After a successful publish the workflow also cuts a GitHub Release for the
# tag, so the Releases tab reflects what is actually on the registry — a bare
# tag leaves no trace on the repo's front page.
#
# To release: bump the version across the whole workspace (root + every
# packages/* — keep them in lockstep), merge to main, then push a matching tag:
#   git tag -s v0.3.0 && git push origin v0.3.0
# The tag push triggers this workflow. `workflow_dispatch` is a manual fallback
# (it skips the tag/version guards and does not cut a Release).
name: Release

on:
    push:
        tags: ["v*.*.*"]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    publish:
        name: Publish to GitHub Packages
        runs-on: ubuntu-latest
        permissions:
            contents: write # cut the GitHub Release for the tag
            packages: write # publish to npm.pkg.github.com with GITHUB_TOKEN
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                  egress-policy: audit

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
              # version comes from package.json "packageManager"

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22"
                  registry-url: "https://npm.pkg.github.com"
                  scope: "@hiero-hackers"
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            # A tag must match the workspace version — otherwise a mistaken tag
            # would publish the wrong version. (Skipped on manual runs.)
            - name: Tag matches workspace version
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  root=$(node -p "require('./package.json').version")
                  tag="${GITHUB_REF_NAME#v}"
                  if [ "$root" != "$tag" ]; then
                      echo "::error::tag v$tag does not match workspace version $root"
                      exit 1
                  fi
                  echo "publishing $root"

            # Every publishable package must carry that same version — guards
            # against a half-bumped workspace publishing mixed versions.
            - name: Packages share the workspace version
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  root=$(node -p "require('./package.json').version")
                  for p in packages/*/; do
                      name=$(node -p "require('./${p}package.json').name")
                      priv=$(node -p "require('./${p}package.json').private === true")
                      [ "$priv" = "true" ] && continue
                      v=$(node -p "require('./${p}package.json').version")
                      if [ "$v" != "$root" ]; then
                          echo "::error::$name is $v, expected $root"
                          exit 1
                      fi
                  done

            # dist/ must exist before publish (each package ships `files: [dist]`).
            - name: Build
              run: pnpm -r run build

            - name: Publish
              run: pnpm -r publish --no-git-checks
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # A tag alone is invisible on the repo's front page — the Releases
            # tab stays empty and there is nowhere to point consumers at. Cut
            # the Release only after the publish above succeeded, so a Release
            # never advertises versions that are not on the registry. Re-running
            # is safe: an existing Release for the tag is left alone.
            - name: Create GitHub Release
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                      echo "release $GITHUB_REF_NAME already exists — leaving it as is"
                      exit 0
                  fi
                  version="${GITHUB_REF_NAME#v}"
                  # Heredoc rather than --notes: the body is markdown, and any
                  # stray leading indentation would render as a code block.
                  cat > /tmp/release-notes.md <<EOF
                  Published to the [GitHub Packages npm registry](https://github.com/orgs/hiero-hackers/packages?repo_name=hiero-enterprise-js) at \`$version\`:

                  - \`@hiero-hackers/enterprise-core\`
                  - \`@hiero-hackers/enterprise-mirror\`
                  - \`@hiero-hackers/enterprise-express\`
                  - \`@hiero-hackers/enterprise-fastify\`
                  - \`@hiero-hackers/enterprise-nest\`

                  Installing requires a GitHub token with \`read:packages\` — see [CONTRIBUTING](https://github.com/hiero-hackers/hiero-enterprise-js/blob/main/CONTRIBUTING.md#installing-the-published-packages).
                  EOF
                  gh release create "$GITHUB_REF_NAME" \
                      --verify-tag \
                      --title "$GITHUB_REF_NAME" \
                      --notes-file /tmp/release-notes.md \
                      --generate-notes
