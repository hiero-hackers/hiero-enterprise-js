# SPDX-License-Identifier: Apache-2.0

name: "Moderate New Issues"

on:
    issues:
        types:
            - opened

defaults:
    run:
        shell: bash

permissions:
    issues: write

concurrency:
    group: moderate-issues-${{ github.event.issue.number }}
    cancel-in-progress: false

jobs:
    moderate:
        name: Moderate Issue
        runs-on: ubuntu-latest

        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                  egress-policy: audit

            # Committers and maintainers (write access or above) skip moderation.
            - name: Check author permission
              id: author
              run: |
                  permission=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission) || permission=none
                  case "$permission" in
                    admin|write) echo "trusted=true" >> "$GITHUB_OUTPUT" ;;
                    *) echo "trusted=false" >> "$GITHUB_OUTPUT" ;;
                  esac
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
                  AUTHOR: ${{ github.event.issue.user.login }}

            - name: Add pending-review label
              if: steps.author.outputs.trusted != 'true'
              uses: actions-ecosystem/action-add-labels@18f1af5e3544586314bbe15c0273249c770b2daf # v1.1.3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  labels: pending-review

            - name: Comment on issue
              if: steps.author.outputs.trusted != 'true'
              uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
              with:
                  issue-number: ${{ github.event.issue.number }}
                  body: |
                      Thanks for your submission.

                      This issue is awaiting approval from @hiero-hackers/hiero-enterprise-js-committers and @hiero-hackers/hiero-enterprise-js-maintainers.

            - name: Lock issue
              if: steps.author.outputs.trusted != 'true'
              run: |
                  gh api \
                    -X PUT \
                    repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/lock \
                    -f lock_reason=off-topic
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
