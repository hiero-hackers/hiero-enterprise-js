# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
    # 1. Updates JavaScript/TypeScript dependencies
    - package-ecosystem: "npm"
      directory: "/" # Location of package.json
      schedule:
          interval: "daily" # Daily check for faster security patching
      open-pull-requests-limit: 10
      ignore:
          # TypeScript majors are a deliberate migration, not a routine bump.
          # TS 7 is the Go-based compiler rewrite, and typescript-eslint
          # refuses to load against it outright:
          #
          #     Error: typescript-eslint does not support TS 7.0.
          #
          # Because every dep here is grouped into one PR, that single
          # incompatibility fails the ESLint step and *skips* build,
          # spec-drift, published-types and the integration tests — so an
          # otherwise-good batch of nine bumps lands untested (#190).
          #
          # Minor and patch TypeScript updates still come through. Remove this
          # entry when adopting a new major deliberately, once the lint
          # toolchain supports it.
          - dependency-name: "typescript"
            update-types: ["version-update:semver-major"]
      groups:
          dependencies:
              patterns:
                  - "*" # Groups bot PRs together

    # 2. Updates GitHub Actions dependencies (Required for OpenSSF Scorecard)
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      groups:
          # codeql-action's init/analyze/upload-sarif steps must move in
          # lockstep — a workflow mixing versions fails, so split PRs
          # (one per pinned usage) can never each go green. One grouped
          # PR bumps every usage together.
          codeql-action:
              patterns:
                  - "github/codeql-action*"
